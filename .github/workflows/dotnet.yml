name: .NET CI

on:
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Build
        run: dotnet build TaskPlanner.sln --configuration Release --no-restore

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Unit tests
        run: dotnet test Tests/TaskPlanner.Tests.Unit/TaskPlanner.Tests.Unit.csproj --configuration Release --verbosity normal

  integration_tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Start MongoDB (replica set for transactions)
        run: |
          docker run -d --name mongo-rs \
            -p 27017:27017 \
            mongo:7 \
            mongod --replSet rs0 --bind_ip_all

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if docker exec mongo-rs mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q 1; then
              echo "MongoDB is up"
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not start in time"
          docker logs mongo-rs
          exit 1

      - name: Initiate replica set
        run: |
          docker exec mongo-rs mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          # wait until PRIMARY
          for i in {1..30}; do
            if docker exec mongo-rs mongosh --quiet --eval "rs.isMaster().ismaster" | grep -q true; then
              echo "Replica set is PRIMARY"
              exit 0
            fi
            sleep 1
          done
          echo "Replica set did not become PRIMARY"
          docker exec mongo-rs mongosh --quiet --eval "rs.status()"
          exit 1

      - name: Integration tests
        env:
          MONGODB_CONNECTION_STRING: mongodb://localhost:27017/?replicaSet=rs0&retryWrites=true&w=majority
        run: dotnet test Tests/TaskPlanner.Tests.Integration/TaskPlanner.Tests.Integration.csproj --configuration Release --verbosity normal

      - name: Dump Mongo logs on failure
        if: failure()
        run: docker logs mongo-rs
