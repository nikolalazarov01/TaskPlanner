name: .NET CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Build
        run: dotnet build TaskPlanner.sln --configuration Release --no-restore

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Unit tests
        run: dotnet test Tests/TaskPlanner.Tests.Unit/TaskPlanner.Tests.Unit.csproj --configuration Release --verbosity normal

  integration_tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TaskPlanner.sln

      - name: Integration tests
        env:
          MONGODB_CONNECTION_STRING: mongodb://localhost:27017
        run: dotnet test Tests/TaskPlanner.Tests.Integration/TaskPlanner.Tests.Integration.csproj --configuration Release --verbosity normal
